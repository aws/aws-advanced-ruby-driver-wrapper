extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  awsxray:
    endpoint: 0.0.0.0:2000
    transport: udp

processors:
  batch/traces:
    timeout: 1s
    send_batch_size: 1
  batch/metrics:
    timeout: 1s

exporters:
  awsxray:
    # The wrapper records traces only through OpenTelemetry, not the X-Ray SDK (which is in
    # maintenance mode). The AWS X-Ray service itself accepts OpenTelemetry traces, so this collector
    # forwards the tests' OTLP traces to it; any other OpenTelemetry backend would work the same way.
    #
    # These span attributes are exported as X-Ray annotations rather than metadata, so that traces
    # can be filtered on them: by test, by wrapper call, and by the test trace a wrapper call's trace
    # belongs to.
    indexed_attributes: [test_name, engine, deployment, ruby_call, parent_trace_id, source_trace_id]
  awsemf:
    log_group_name: "aws_advanced_ruby_driver_wrapper"

service:
  pipelines:
    traces:
      receivers: [otlp,awsxray]
      processors: [batch/traces]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch/metrics]
      exporters: [awsemf]

  extensions: [health_check]
