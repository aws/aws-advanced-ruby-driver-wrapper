name: Run Aurora MySQL Performance Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aurora-mysql-performance-tests:
    name: 'Run Aurora MySQL performance tests'
    runs-on: ubuntu-latest

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v7

      - name: 'Set up Ruby 3.3'
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_perf_test_mysql
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Run MySQL performance tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-ruby-3.3-mysql-performance --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Archive performance results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 'mysql-performance-results'
          path: |
            ./spec/integration/host/build/reports/tests/test/
            ./spec/integration/container/reports/
          if-no-files-found: ignore
          retention-days: 5
