name: Run Aurora MySQL Performance Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aurora-mysql-performance-tests:
    name: 'Run Aurora MySQL performance tests'
    runs-on: ubuntu-latest

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Validate Gradle wrapper'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 'Set up Ruby 3.3'
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_perf_test_mysql
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Run MySQL performance tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-ruby-3.3-mysql-performance --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Archive performance results'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 'mysql-performance-results'
          path: |
            ./spec/integration/host/build/reports/tests/test/
            ./spec/integration/container/reports/
          if-no-files-found: ignore
          retention-days: 5
