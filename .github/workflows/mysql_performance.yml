# GitHub-hosted backup of the CodeBuild workflow mysql_performance-codebuild.yml.
#
# Runs the same job on GitHub-hosted ubuntu runners. Kept as a manual-dispatch-only fallback; the
# CodeBuild variant is the one wired to any automated trigger. Uses a per-ref
# concurrency group with cancel-in-progress, so a newer run on the same ref supersedes the one in progress.

name: Run Aurora MySQL Performance Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Pull test container images from ECR Public rather than Docker Hub. GitHub-hosted runners pull
  # from a pool of egress IPs shared across all GitHub customers, with no Docker Hub credentials, so
  # anonymous Docker Hub pulls get rate limited.
  TEST_CONTAINER_REGISTRY: ecr

concurrency:
  # One run per workflow per ref: a newer run on the same ref cancels the one in progress, so a new
  # push supersedes a stale commit. The "Clean up RDS resources" step runs on cancellation, so a
  # superseded run tears down the DB clusters it created instead of leaking them.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aurora-mysql-performance-tests:
    name: 'Run Aurora MySQL performance tests'
    runs-on: ubuntu-latest

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Validate Gradle wrapper'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: 'Set up Ruby 3.3'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_perf_test_mysql
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Run MySQL performance tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-ruby-3.3-mysql-performance --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Archive performance results'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'mysql-performance-results'
          path: |
            ./spec/integration/host/build/reports/tests/test/
            ./spec/integration/container/reports/
          if-no-files-found: ignore
          retention-days: 5
