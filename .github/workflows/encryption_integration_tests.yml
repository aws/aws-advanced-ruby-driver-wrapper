name: Encryption Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# These workflows create real RDS clusters and a real KMS key. Only run one KMS-encryption job at a
# time so the two engine matrix legs share (and do not race to create) the cached key.
concurrency:
  group: encryption-integration-tests
  cancel-in-progress: false

jobs:
  encryption-integration-tests:
    name: Run KMS Encryption Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [ 'mysql', 'pg' ]

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Validate Gradle wrapper'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 'Set up Ruby 3.3'
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Configure AWS Credentials'
        id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_encryption_integration_tests
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Find or create the test KMS key'
        id: kms
        run: |
          ALIAS="alias/ruby-encryption-key"
          KEY_ID=$(aws kms list-aliases \
            --query "Aliases[?AliasName=='${ALIAS}'].TargetKeyId" --output text 2>/dev/null || echo "")

          if [ -n "$KEY_ID" ]; then
            STATE=$(aws kms describe-key --key-id "$KEY_ID" \
              --query 'KeyMetadata.KeyState' --output text 2>/dev/null || echo "")
            if [ "$STATE" != "Enabled" ]; then KEY_ID=""; fi
          fi

          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(aws kms create-key \
              --description "aws-advanced-ruby-driver-wrapper encryption test key (cached)" \
              --key-usage ENCRYPT_DECRYPT --key-spec SYMMETRIC_DEFAULT \
              --tags TagKey=Project,TagValue=aws-advanced-ruby-driver-wrapper TagKey=Purpose,TagValue=testing \
              --query 'KeyMetadata.KeyId' --output text)
            aws kms create-alias --alias-name "$ALIAS" --target-key-id "$KEY_ID"
            aws kms enable-key-rotation --key-id "$KEY_ID"
          fi

          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "Using KMS key: $KEY_ID"

      - name: 'Run KMS Encryption Integration Tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-${{ matrix.environment }}-encryption --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          KMS_KEY_ID: ${{ steps.kms.outputs.key_id }}

      - name: 'Archive encryption results'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rspec-encryption-report-${{ matrix.environment }}
          path: ./spec/integration/host/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 5
