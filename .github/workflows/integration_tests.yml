name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lts-integration-tests:
    name: Run LTS Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ 'mysql', 'pg' ]

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v7

      - name: 'Set up Ruby 3.3'
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_integration_tests
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Run LTS Integration Tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-ruby-3.3-${{ matrix.environment }} --info
        env:
          RDS_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AURORA_MYSQL_DB_ENGINE_VERSION: lts
          AURORA_PG_ENGINE_VERSION: lts

      - name: 'Archive LTS results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-integration-report-3.3-${{ matrix.environment }}-lts
          path: ./spec/integration/host/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 5

  latest-integration-tests:
    name: Run Latest Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ 'mysql', 'pg' ]

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v7

      - name: 'Set up Ruby 4.0'
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: 'Set up JDK 8'
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_integration_tests
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 'Run Latest Integration Tests'
        run: ./gradlew --no-parallel --no-daemon :integration-testing:test-ruby-4.0-${{ matrix.environment }} --info
        env:
          RDS_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AURORA_MYSQL_DB_ENGINE_VERSION: latest
          AURORA_PG_ENGINE_VERSION: latest

      - name: 'Archive Latest results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-integration-report-4.0-${{ matrix.environment }}-latest
          path: ./spec/integration/host/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 5
