name: Run Blue/Green Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 9:00 AM UTC
    - cron: '0 9 * * 0'

permissions:
  id-token: write
  contents: read

jobs:
  bg-integration-tests:
    name: BG Integration Tests (${{ matrix.testTask }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        testTask:
          - test-bgd-mysql-aurora
          - test-bgd-pg-aurora
          - test-bgd-mysql-instance
          - test-bgd-pg-instance
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '8'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: ruby_bg_integration_tests
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Run BG Integration Tests
        run: ./gradlew --no-parallel --no-daemon :integration-testing:${{ matrix.testTask }} --info
        env:
          RDS_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bg-report-${{ matrix.testTask }}
          path: ./spec/integration/host/build/reports/tests/test/
          retention-days: 5
