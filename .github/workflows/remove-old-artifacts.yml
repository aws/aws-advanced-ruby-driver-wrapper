# GitHub-hosted backup of the CodeBuild workflow remove-old-artifacts-codebuild.yml.
#
# Runs the same job on GitHub-hosted ubuntu runners. Kept as a manual-dispatch-only fallback; the
# CodeBuild variant owns the schedule (commented out below).

name: Remove Old Artifacts

on:
  workflow_dispatch:
  # The schedule moved to the CodeBuild variant remove-old-artifacts-codebuild.yml.
  # schedule:
  #   # Every day at 1am
  #   - cron: '0 1 * * *'

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove Old Artifacts
        uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61 # v1
        with:
          age: '1 week'
          skip-tags: true
