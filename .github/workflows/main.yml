name: Check and Unit Tests

on:
  workflow_dispatch:
  # The push and pull_request triggers moved to the CodeBuild variant main-codebuild.yml.
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - '*'

concurrency:
  # One run per workflow per ref: a newer run on the same ref cancels the one in progress, so a new
  # push or PR update supersedes a stale commit instead of queueing behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changes:
    name: 'Check for changes'
    runs-on: ubuntu-latest
    outputs:
      only_docs: ${{ steps.check.outputs.ONLY_DOCS }}
      docs_changed: ${{ steps.check.outputs.DOCS_CHANGED }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 50
      - name: 'Get changed files'
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            doc:
              - '**/*.md'
              - '**/docs/**'
              - '**/*.jpg'
              - '**/*.png'
      - name: 'Determine change type'
        id: check
        run: |
          if [[ "${{ steps.changed-files-specific.outputs.doc_only_changed }}" == "true" || "${{ steps.changed-files-specific.outputs.doc_only_modified }}" == "true" ]]; then
            echo "ONLY_DOCS=true" >> $GITHUB_OUTPUT
          else
            echo "ONLY_DOCS=false" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ steps.changed-files-specific.outputs.doc_any_changed }}" == "true" ]]; then
            echo "DOCS_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "DOCS_CHANGED=false" >> $GITHUB_OUTPUT
          fi

  markdown-link-check:
    name: 'Markdown link check'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.docs_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1
        with:
          use-quiet-mode: 'yes'
          config-file: 'mlc_config.json'
          folder-path: '.'
          max-depth: 0

  lint:
    name: 'Static analysis'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  pg-sql-qualification:
    name: PostgreSQL SQL qualification check
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Check internal PostgreSQL SQL is schema-qualified
        run: ruby .github/scripts/check_pg_sql_qualified.rb

  test:
    name: 'Unit tests'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.3'
            gemfile: gemfiles/activerecord_7.2.gemfile
          - ruby-version: '3.4'
            gemfile: gemfiles/activerecord_8.0.gemfile
          - ruby-version: '4.0'
            gemfile: gemfiles/activerecord_8.1.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec rspec spec/unit
      - name: Upload coverage reports
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/coverage.xml
          flags: unittests
          name: ruby-wrapper-unit-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version
      - name: Run Gitleaks (full git history)
        run: gitleaks detect --source . --redact --verbose

  ci-gate:
    name: 'CI Gate'
    needs: [check-changes, markdown-link-check, lint, pg-sql-qualification, test, secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Verify required jobs did not fail'
        run: |
          # Fail only if a needed job actually failed or was cancelled.
          # Skipped jobs (e.g. tests on doc-only PRs) are treated as passing,
          # so this gate is the single required status check for branch protection.
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were legitimately skipped."
